; Short real-data OCO2 multisector smoke run.
; The raw-observation gosat_process_template.ini is not an inversion config,
; so this file uses the modern RHIME config schema and values from the supplied
; production HBMCMC INI.

[INPUT.MEASUREMENTS]
species = "co2"
sites = ["OCO2-EASTASIA"]
averaging_period = ["1H"]
; Start one footprint back-window early. The six retained OCO2 soundings begin
; at 2022-04-01 04:07:34, while the resolved footprint needs 24 h of flux.
start_date = "2022-03-31 04:00:00"
end_date = "2022-04-01 04:08:10"
inlet = ["column"]
instrument = [None]
platform = ["satellite"]
max_level = [3]
time_resolved = [True]
obs_data_level = None
filters = []

[INPUT.STORES]
bc_store = "/group/chem/acrg/object_stores/temp/OCO2_test"
obs_store = "/group/chem/acrg/object_stores/temp/OCO2_test"
footprint_store = "/group/chem/acrg/object_stores/OCO2/OCO2_HR_bk1day_2022"
emissions_store = "/group/chem/acrg/object_stores/temp/OCO2_test"

[INPUT.PRIORS]
domain = "EASTASIA"
met_model = None
fp_model = None
fp_height = ["column"]
fp_species = "co2"
; Do not combine these with `all` or `nep`: those aggregate overlapping fluxes.
flux_sources = ["anth", "resp", "gpp_atm"]
sector_sources = {"anthropogenic": "anth", "respiration": "resp", "gpp": "gpp_atm"}
bc_input = "cams"

[INPUT.BASIS_CASE]
basis_algorithm = "weighted"
fp_basis_case = None
nbasis = 8
basis_directory = "/group/chem/acrg/LPDM/basis_functions/"
bc_basis_case = "NESW"
bc_basis_directory = "/group/chem/acrg/LPDM/bc_basis_functions/"
country_directory = "/group/chem/acrg/LPDM/countries/"
country_file = "/group/chem/acrg/LPDM/countries/country_chineseprovinces_EASTASIA.nc"
fix_basis_outer_regions = False
basis_output_path = "/user/home/vq21425/openghg_inversions/run_artifacts/oco2_multisector_short/basis"

[RHIME.PDF]
x_prior = {"pdf": "lognormal", "mean": 1.0, "stdev": 0.5}
bc_prior = {"pdf": "truncatednormal", "lower": 0.0, "mu": 1.0, "sigma": 1.0}
sigma_prior = {"pdf": "uniform", "lower": 0.1, "upper": 10.0}
add_offset = False

[RHIME.SPLIT]
bc_freq = None
sigma_freq = None
sigma_per_site = True

[RHIME.ITERATIONS]
draws = 4
burn = 0
tune = 4
chains = 1
nuts_sampler = "pymc"
progressbar = False
sample_kwargs = {"random_seed": 20220810, "compute_convergence_checks": False, "cores": 1}
posterior_predictive_kwargs = {"random_seed": 20220810, "progressbar": False}

[RHIME.OPTIONS]
averaging_error = True
min_error = 0.0
use_bc = True
; The current multisector output bundle writes PARIS and sector diagnostics,
; but does not implement trace saving.
save_trace = False
save_inversion_output = False
pollution_events_from_obs = True
no_model_error = False
builder_strategy = "concrete"
flux_non_finite_check = "lazy"
output_format = "paris"
; None keeps all labels from the supplied Chinese-province country mask rather
; than applying the default 22-country European PARIS selection.
paris_postprocessing_kwargs = {"template_version": "latest", "inversion_grid": True, "country_selections": None}

[RHIME.OUTPUT]
output_path = "/user/home/vq21425/openghg_inversions/run_artifacts/oco2_multisector_short/output"
output_name = "oco2_eastasia_6obs_3sector"
