name: OpenGHG Inversions tests

on:
  push:
    branches: [main, devel]
    tags:
    - '*'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'newsfragments/**'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'newsfragments/**'
  # Allow manual runs from the Actions UI with the same checks as automatic runs
  workflow_dispatch:
    inputs:
      compiled_backend:
        description: "Also run the marked compiled_backend checks with Numba"
        type: boolean
        default: false
      runtime_comparison:
        description: "Compare one/two numerical threads with serial pytest in the locked environments"
        type: boolean
        default: false

jobs:
  backend:
    name: Select compiled-backend checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      linker: ${{ steps.select.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check backend selection rules
        run: node --test .github/scripts/select-test-linker.test.cjs
      - name: Select optional compiled checks
        id: select
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const select = require('./.github/scripts/select-test-linker.cjs');
            return await select({github, context, core});

  test:
    name: Run tests against OpenGHG devel (Python 3.12)
    needs: backend
    runs-on: ubuntu-latest
    env:
      PYTENSOR_FLAGS: linker=py
      DASK_NUM_WORKERS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          uv pip install --system --upgrade setuptools wheel
          uv pip install --system "git+https://github.com/openghg/openghg.git@devel" -e . pytest pytest-xdist
      - name: Report scientific I/O versions and PyTensor backend
        run: >-
          python -c 'import h5py, h5netcdf, netCDF4, numpy, sys, xarray;
          import pytensor; from pytensor.compile.mode import get_mode;
          print("PyTensor linker:", pytensor.config.linker, type(get_mode(None).linker).__name__);
          print(f"Python {sys.version.split()[0]}, NumPy {numpy.__version__}, xarray {xarray.__version__},
          h5py {h5py.__version__} (HDF5 {h5py.version.hdf5_version}),
          h5netcdf {h5netcdf.__version__}, netCDF4 {netCDF4.__version__} (HDF5 {netCDF4.__hdf5libversion__})")'
      - name: Prime ArviZ cache
        run: python -c "import arviz"
      - name: Run tests
        run: pytest tests/ -n 2 --dist=worksteal --ignore=tests/typing --durations=25
      - name: Run marked Numba checks
        if: needs.backend.outputs.linker == 'auto'
        env:
          PYTENSOR_FLAGS: linker=numba
        run: |
          python -c 'import pytensor; from pytensor.compile.mode import get_mode; assert type(get_mode(None).linker).__name__ == "NumbaLinker"; print("Compiled checks:", pytensor.config.linker)'
          pytest tests/ -n 0 -m 'compiled_backend and not slow and not create_frozen' --ignore=tests/typing --durations=10

  locked-test:
    name: Run tests with uv.lock (Python ${{ matrix.python-version }})
    needs: backend
    runs-on: ubuntu-latest
    env:
      PYTENSOR_FLAGS: linker=py
      DASK_NUM_WORKERS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      BLIS_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - name: Verify lock tracks the latest OpenGHG release
        run: |
          locked=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("openghg"))')
          latest=$(bash .github/workflows/openghg_versions.sh)
          if [ "$locked" != "$latest" ]; then
            echo "uv.lock has OpenGHG $locked, but the latest release is $latest. Refresh uv.lock."
            exit 1
          fi
      - name: Report scientific I/O versions and PyTensor backend
        run: >-
          uv run --no-sync python -c 'import h5py, h5netcdf, netCDF4, numpy, sys, xarray;
          import pytensor; from pytensor.compile.mode import get_mode;
          print("PyTensor linker:", pytensor.config.linker, type(get_mode(None).linker).__name__);
          print(f"Python {sys.version.split()[0]}, NumPy {numpy.__version__}, xarray {xarray.__version__},
          h5py {h5py.__version__} (HDF5 {h5py.version.hdf5_version}),
          h5netcdf {h5netcdf.__version__}, netCDF4 {netCDF4.__version__} (HDF5 {netCDF4.__hdf5libversion__})")'
      - name: Prime ArviZ cache
        run: uv run --no-sync python -c "import arviz"
      - name: Run tests
        if: github.event_name != 'workflow_dispatch' || !inputs.runtime_comparison
        run: uv run --no-sync pytest tests/ -n 2 --dist=worksteal --ignore=tests/typing --durations=25
      - name: Run marked Numba checks
        if: needs.backend.outputs.linker == 'auto' && !(github.event_name == 'workflow_dispatch' && inputs.runtime_comparison)
        env:
          PYTENSOR_FLAGS: linker=numba
        run: |
          uv run --no-sync python -c 'import pytensor; from pytensor.compile.mode import get_mode; assert type(get_mode(None).linker).__name__ == "NumbaLinker"; print("Compiled checks:", pytensor.config.linker)'
          uv run --no-sync pytest tests/ -n 0 -m 'compiled_backend and not slow and not create_frozen' --ignore=tests/typing --durations=10
      - name: Profile serial suite
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_comparison
        env:
          PYTENSOR_FLAGS: linker=numba
          DASK_NUM_WORKERS: '2'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OGI_TEST_RUNTIME_REPORT: runtime-suite/runtime.json
        run: |
          mkdir runtime-suite
          /usr/bin/time -v -o runtime-suite/time.txt uv run --no-sync python -m pytest tests/ -p no:xdist -p tests.ci_runtime --ignore=tests/typing --durations=25 --junitxml=runtime-suite/results.xml
      - name: Compare numerical thread limits
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_comparison
        env:
          PYTENSOR_FLAGS: linker=numba
        run: uv run --no-sync python scripts/compare_test_runtime.py runtime-comparison
      - name: Upload test runtime diagnostics
        if: always() && github.event_name == 'workflow_dispatch' && inputs.runtime_comparison
        uses: actions/upload-artifact@v7
        with:
          name: test-runtime-locked-py${{ matrix.python-version }}
          path: |
            runtime-suite/
            runtime-comparison/
          retention-days: 7

  lint:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run lint
        run: tox -e lint

  borrowed-types:
    name: Verify borrowed-reference typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Verify Pyright and Mypy diagnostics
        run: tox -e borrowed-types

  # Stable job name for branch-protection required-check rules.
  # Use "CI Gate" as the required check name.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, locked-test, lint, borrowed-types]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check test and lint results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "OpenGHG devel tests failed, were cancelled, or were skipped (result: ${{ needs.test.result }})."
            exit 1
          fi
          if [ "${{ needs.locked-test.result }}" != "success" ]; then
            echo "Lockfile test job failed, was cancelled, or was skipped (result: ${{ needs.locked-test.result }})."
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job failed, was cancelled, or was skipped (result: ${{ needs.lint.result }})."
            exit 1
          fi
          if [ "${{ needs.borrowed-types.result }}" != "success" ]; then
            echo "Borrowed-reference typing failed, was cancelled, or was skipped (result: ${{ needs.borrowed-types.result }})."
            exit 1
          fi
          echo "OpenGHG devel and locked-release tests, lint, and borrowed-reference typing checks passed."
