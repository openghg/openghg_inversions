name: OpenGHG Inversions tests

on:
  push:
    branches: [main, devel]
    tags:
    - '*'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'CHANGELOG.md'
  # Allow manual runs from the Actions UI with the same matrix as automatic runs
  workflow_dispatch:

jobs:
  openghg-version:
    name: Get OpenGHG version
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      latest_minor: ${{ steps.versions.outputs.OPENGHG_LATEST_MINOR }}
      previous_minor: ${{ steps.versions.outputs.OPENGHG_PREVIOUS_MINOR }}
      devel: ${{ steps.versions.outputs.OPENGHG_DEVEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: set OpenGHG latest and previous minor versions, and devel
        id: versions
        run: |
          echo "OPENGHG_LATEST_MINOR=openghg==$(bash .github/workflows/openghg_versions.sh)" >> "$GITHUB_OUTPUT"
          echo "OPENGHG_PREVIOUS_MINOR=openghg==$(bash .github/workflows/openghg_versions.sh -N 1)" >> "$GITHUB_OUTPUT"
          echo "OPENGHG_DEVEL=git+https://github.com/openghg/openghg.git@devel" >> "$GITHUB_OUTPUT"
      - name: check OpenGHG  versions
        run: |
          echo "OpenGHG latest minor release: ${{ steps.versions.outputs.OPENGHG_LATEST_MINOR }}"
          echo "OpenGHG previous minor release: ${{ steps.versions.outputs.OPENGHG_PREVIOUS_MINOR }}"
          echo "OpenGHG devel: ${{ steps.versions.outputs.OPENGHG_DEVEL }}"

  test:
    name: Run tests on (${{ matrix.openghg-version }}, python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: openghg-version
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10"]
        openghg-version: ["${{ needs.openghg-version.outputs.latest_minor }}", "${{ needs.openghg-version.outputs.previous_minor }}", "${{ needs.openghg-version.outputs.devel }}"]
    steps:
      - name: check versions
        run: |
          echo "Running tests against OpenGHG versions:"
          echo "${{ needs.openghg-version.outputs.latest_minor }}"
          echo "${{ needs.openghg-version.outputs.previous_minor }}"
          echo "${{ needs.openghg-version.outputs.devel }}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          uv pip install --system --upgrade setuptools wheel
          # Keep the matrix-selected OpenGHG target in the same uv resolution as the package install.
          uv pip install --system "${{ matrix.openghg-version }}" -r requirements.txt -e . pytest pytest-xdist
      - name: Prime ArviZ cache
        run: python -c "import arviz"
      - name: Run tests
        run: pytest tests/ -n 2 --dist=loadscope

  lint:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run lint
        run: tox -e lint

  # Stable job name for branch-protection required-check rules.
  # Use "CI Gate" as the required check name instead of brittle matrix-expanded names.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check test and lint results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix job(s) failed, were cancelled, or were skipped (result: ${{ needs.test.result }})."
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job failed, was cancelled, or was skipped (result: ${{ needs.lint.result }})."
            exit 1
          fi
          echo "All tests and lint checks passed."
