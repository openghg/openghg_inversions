name: OpenGHG Inversions tests

on:
  push:
    branches: [main, devel]
    tags:
    - '*'
    paths-ignore:
      - 'CHANGELOG.md'
      - 'newsfragments/**'
  pull_request:
    branches: [main, devel]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'newsfragments/**'
  # Allow manual runs from the Actions UI with the same checks as automatic runs
  workflow_dispatch:

jobs:
  test:
    name: Run tests against OpenGHG devel (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          uv pip install --system --upgrade setuptools wheel
          uv pip install --system "git+https://github.com/openghg/openghg.git@devel" -e . pytest pytest-xdist
      - name: Report scientific I/O versions
        run: >-
          python -c 'import h5py, h5netcdf, netCDF4, numpy, sys, xarray;
          print(f"Python {sys.version.split()[0]}, NumPy {numpy.__version__}, xarray {xarray.__version__},
          h5py {h5py.__version__} (HDF5 {h5py.version.hdf5_version}),
          h5netcdf {h5netcdf.__version__}, netCDF4 {netCDF4.__version__} (HDF5 {netCDF4.__hdf5libversion__})")'
      - name: Prime ArviZ cache
        run: python -c "import arviz"
      - name: Run tests
        run: pytest tests/ -n 2 --dist=worksteal --durations=25

  locked-test:
    name: Run tests with uv.lock (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: uv sync --locked --group test --python ${{ matrix.python-version }}
      - name: Verify lock tracks the latest OpenGHG release
        run: |
          locked=$(uv run --no-sync python -c 'from importlib.metadata import version; print(version("openghg"))')
          latest=$(bash .github/workflows/openghg_versions.sh)
          if [ "$locked" != "$latest" ]; then
            echo "uv.lock has OpenGHG $locked, but the latest release is $latest. Refresh uv.lock."
            exit 1
          fi
      - name: Report scientific I/O versions
        run: >-
          uv run --no-sync python -c 'import h5py, h5netcdf, netCDF4, numpy, sys, xarray;
          print(f"Python {sys.version.split()[0]}, NumPy {numpy.__version__}, xarray {xarray.__version__},
          h5py {h5py.__version__} (HDF5 {h5py.version.hdf5_version}),
          h5netcdf {h5netcdf.__version__}, netCDF4 {netCDF4.__version__} (HDF5 {netCDF4.__hdf5libversion__})")'
      - name: Prime ArviZ cache
        run: uv run --no-sync python -c "import arviz"
      - name: Run tests
        run: uv run --no-sync pytest tests/ -n 2 --dist=worksteal --durations=25

  lint:
    name: Run lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Run lint
        run: tox -e lint

  borrowed-types:
    name: Verify borrowed-reference typing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tox
        run: uv tool install tox --with tox-uv
      - name: Verify Pyright and Mypy diagnostics
        run: tox -e borrowed-types

  # Stable job name for branch-protection required-check rules.
  # Use "CI Gate" as the required check name.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [test, locked-test, lint, borrowed-types]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: Check test and lint results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "OpenGHG devel tests failed, were cancelled, or were skipped (result: ${{ needs.test.result }})."
            exit 1
          fi
          if [ "${{ needs.locked-test.result }}" != "success" ]; then
            echo "Lockfile test job failed, was cancelled, or was skipped (result: ${{ needs.locked-test.result }})."
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job failed, was cancelled, or was skipped (result: ${{ needs.lint.result }})."
            exit 1
          fi
          if [ "${{ needs.borrowed-types.result }}" != "success" ]; then
            echo "Borrowed-reference typing failed, was cancelled, or was skipped (result: ${{ needs.borrowed-types.result }})."
            exit 1
          fi
          echo "OpenGHG devel and locked-release tests, lint, and borrowed-reference typing checks passed."
