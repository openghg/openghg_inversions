name: Test Publish to TestPyPI

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  test-publish:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openghg-inversions
    permissions:
      id-token: write
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Require a released OpenGHG dependency for publication
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path

          dependencies = tomllib.loads(Path("pyproject.toml").read_text())["project"]["dependencies"]
          if any(value.startswith("openghg @ ") for value in dependencies):
              raise SystemExit(
                  "Replace the temporary OpenGHG Git dependency with a released minimum "
                  "containing the Numba fp_x_flux algorithm before publishing OGI."
              )
          PY
      
      - name: Build package
        run: uv build
      
      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always
