; Workspace-local copy of:
; /group/chem/acrg/prasad/job_scripts/openghg_inversions/inversion_outputs/
; PARISNID2026_EUROPE_6km/hbmcmc.ini
;
; Converted from the legacy fixed-basis vocabulary to the modern nested RHIME
; vocabulary. The source INI and its existing output directory are unchanged.

[INPUT.MEASUREMENTS]
species = "ch4"
use_tracer = False
sites = ["MHD"]
averaging_period = "4H"
start_date = "2023-01-01"
end_date = "2023-02-01"

save_merged_data = False
reload_merged_data = False
merged_data_dir = "/user/home/vq21425/openghg_inversions/inversion_outputs/PARISNID2026_EUROPE_6km/merged_data"

inlet = [slice(0, 25)]
instrument = ["multiple"]
filters = {"MHD": ["pblh_min", "pblh_inlet_diff"]}

[INPUT.STORES]
bc_store = "/group/chem/acrg/object_stores/shared_store_zarr"
obs_store = "/group/chem/acrg/object_stores/paris/obs_icos_2025_08_store"
footprint_store = "/group/chem/acrg/object_stores/paris/merged_footprints"
emissions_store = "/group/chem/acrg/object_stores/shared_store_zarr"

[INPUT.PRIORS]
domain = "EUROPE"
fp_model = "NAME"
fp_height = ["10m"]
fp_species = "inert"
flux_sources = ["edgarv80_wetchartsv131"]
bc_input = ["camsv22r2_daily"]

[INPUT.NESTED_DOMAIN]
inner_domain = "6km"
inner_footprint_store = "/group/chem/acrg/object_stores/shared_store_zarr"
; Inner emissions use the same explicitly configured shared emissions store.
inner_emissions_store = "/group/chem/acrg/object_stores/shared_store_zarr"
inner_emissions_domain = "EUROPE"
inner_basis_algorithm = "quadtree"

[INPUT.BASIS_CASE]
basis_algorithm = "quadtree"
bc_basis_case = "NESW"
fp_basis_case = None
nbasis = 250
basis_directory = "/group/chem/acrg/LPDM/basis_functions/"
bc_basis_directory = "/group/chem/acrg/LPDM/bc_basis_functions/"
country_file = "/group/chem/acrg/LPDM/countries/country_EUROPE_EEZ_PARIS_gapfilled.nc"
fix_basis_outer_regions = True
outer_regions_path = "intem_region_definition_EUHROB.nc"

[RHIME.PDF]
x_prior = {"pdf": "lognormal", "stdev": 8.0, "reparameterise": True}
bc_prior = {"pdf": "truncatednormal", "mu": 1.0, "sigma": 0.1, "lower": 0.0}
sigma_prior = {"pdf": "uniform", "lower": 0.1, "upper": 1.0}

[RHIME.SPLIT]
bc_freq = "monthly"
sigma_freq = "monthly"
sigma_per_site = True

[RHIME.ITERATIONS]
draws = 20000
burn = 10000
tune = 10000
chains = 4

[RHIME.OPTIONS]
averaging_error = True
min_error = "percentile"
use_bc = True
mismatch_model = "pollution_event"
pollution_events_from_obs = True
nuts_sampler = "numpyro"
save_trace = False
save_inversion_output = False

[RHIME.OUTPUT]
; Nested RHIME currently requires output_format="none". The workspace launcher
; saves the trace and native outer/inner/combined prepared inputs explicitly.
output_path = "/user/home/vq21425/openghg_inversions/inversion_outputs/PARISNID2026_EUROPE_6km/results"
output_name = "std"
output_format = "none"
