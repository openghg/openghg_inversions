[tox]
min_version = 4.24
requires =
    tox>=4.24
    tox-uv
isolated_build = True
env_list =
    py312-openghgCur
    borrowed-types
    lint

[testenv]
pass_env =
    PYTENSOR_FLAGS
    MPLCONFIGDIR
    DASK_NUM_WORKERS
    OPENBLAS_NUM_THREADS
    OMP_NUM_THREADS
# Parallel environments must not share OpenGHG's tempfile-based fixture store.
set_env =
    TMPDIR = {env_tmp_dir}
description =
    openghgDev: "Run tests under {base_python} on OpenGHG devel branch."
    openghgCur: "Run tests under {base_python} with the locked OpenGHG dependency."
# Devel must resolve its moving Git dependency outside the lockfile.
runner = uv-venv-runner
package = uv-editable
deps =
    h5py<3.15
    pytest
    pytest-xdist
    openghgDev: git+https://github.com/openghg/openghg.git@devel
commands_pre =
    py312,py313: {envpython} {toxinidir}/scripts/check_pytensor_compiler.py
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:2} --dist=worksteal --ignore=tests/typing {posargs:tests}

[testenv:py312-openghgCur]
runner = uv-venv-lock-runner
extras = dev
deps =

[testenv:py313-openghgCur]
runner = uv-venv-lock-runner
extras = dev
deps =

[testenv:py312-openghgDev]
# Build the editable package separately so tox-uv installs it with --no-deps;
# uv-editable would re-resolve openghg from PyPI after installing devel.
package = editable

[testenv:py312-surfacePilot]
# Acceptance uses the exact OpenGHG revision declared by the project.
runner = uv-venv-lock-runner
extras = dev
description = "Exercise surface preparation with the locked provider revision."
deps =
commands =
    pytest -n 0 {posargs:tests/test_boundary_reference.py tests/test_surface_acquisition.py tests/test_surface_centered_integration.py tests/test_surface_getter_policy.py tests/test_centered_boundary_preparation.py tests/test_centered_co2_boundaries.py tests/test_centered_handoffs.py tests/test_boundary_representation_alignment.py}

[testenv:lint]
description = "Run linters."
skip_install = true
deps =
    ruff==0.16.0
commands =
    ruff check {posargs:.}

[testenv:type]
description = "Run type checker."
runner = uv-venv-lock-runner
extras = dev
deps =
commands =
    mypy {posargs:openghg_inversions}

[testenv:borrowed-types]
description = "Verify experimental borrowed-reference diagnostics with Pyright and Mypy."
runner = uv-venv-lock-runner
extras = dev
deps =
commands =
    pyright --version
    mypy --version
    pytest {posargs:tests/typing/test_borrowed_typing.py}

[testenv:surface-types]
description = "Check scientific surface and centered-boundary contracts, including missing annotations."
runner = uv-venv-lock-runner
extras = dev
deps =
commands =
    mypy --follow-imports=silent --ignore-missing-imports --disallow-untyped-defs openghg_inversions/inversion_data/surface.py openghg_inversions/inversion_data/_boundary.py openghg_inversions/boundary_sensitivity.py openghg_inversions/rhime/co2/centered_boundary.py openghg_inversions/rhime/co2/co2_model.py openghg_inversions/rhime/co2/co2_o2_model.py openghg_inversions/rhime/co2/co2_o2_preparation.py openghg_inversions/rhime/co2/co2_runner.py openghg_inversions/rhime/co2/co2_o2_runner.py openghg_inversions/rhime/co2/co2_o2_cached_sigma_model.py openghg_inversions/rhime/co2/co2_cached_sigma_runner.py openghg_inversions/rhime/co2/co2_o2_cached_sigma_runner.py

[testenv:py312-pymc60]
description = "Check shape hooks at the supported PyMC 6.0 / PyTensor 3.0 lower bound."
base_python = python3.12
runner = uv-venv-runner
skip_install = true
# Resolve the project and old backend together rather than using the current lock.
deps =
    -e {toxinidir}
    pytest
    h5py<3.15
    pymc==6.0.0
    pytensor==3.0.2
commands =
    pytest {posargs:tests/models/test_shape_hooks.py}

[testenv:docs-strict]
deps =
  sphinx==9.1.0
  pydata-sphinx-theme==0.21.0
  jupyter-sphinx==0.5.3
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --no-toc \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/
  sphinx-build -M html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build} -n -W --keep-going

[testenv:docs-full]
description = "Regenerate the API reference and build all documentation."
deps =
  sphinx==9.1.0
  pydata-sphinx-theme==0.21.0
  jupyter-sphinx==0.5.3
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --no-toc \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/
  sphinx-build -M html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build} --keep-going

[testenv:docs-api]
description = "Regenerate the Sphinx API reference files."
skip_install = true
deps =
  sphinx==9.1.0
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --no-toc \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/

[testenv:docs]
description = "Incrementally build the Sphinx documentation for local preview."
deps =
  sphinx==9.1.0
  pydata-sphinx-theme==0.21.0
  jupyter-sphinx==0.5.3
commands =
  # don't be nitpicky or convert warnings to errors
  sphinx-build -M html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build} --keep-going
