[tox]
min_version = 4.24
requires =
    tox>=4.24
    tox-uv
isolated_build = True
env_list =
    py312-openghgCur
    borrowed-types
    lint

[testenv]
description =
    openghgDev: "Run tests under {base_python} on OpenGHG devel branch."
    openghgCur: "Run tests under {base_python} with the locked OpenGHG release."
# Devel must resolve its moving Git dependency outside the lockfile.
runner = uv-venv-runner
package = uv-editable
deps =
    h5py<3.15
    pytest
    pytest-xdist
    openghgDev: git+https://github.com/openghg/openghg.git@devel
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:2} --dist=worksteal {posargs:tests}

[testenv:py312-openghgCur]
runner = uv-venv-lock-runner
extras = dev
deps =

[testenv:py312-openghgDev]
# Build the editable package separately so tox-uv installs it with --no-deps;
# uv-editable would re-resolve openghg from PyPI after installing devel.
package = editable

[testenv:lint]
description = "Run linters."
skip_install = true
deps =
    ruff==0.16.0
commands =
    ruff check {posargs:.}

[testenv:type]
description = "Run type checker."
runner = uv-venv-lock-runner
extras = dev
deps =
commands =
    mypy {posargs:openghg_inversions}

[testenv:borrowed-types]
description = "Verify experimental borrowed-reference diagnostics with Pyright and Mypy."
runner = uv-venv-lock-runner
extras = dev
deps =
commands =
    pytest {posargs:tests/typing/test_borrowed_typing.py}

[testenv:py312-pymc60]
description = "Check shape hooks at the supported PyMC 6.0 / PyTensor 3.0 lower bound."
base_python = python3.12
runner = uv-venv-runner
skip_install = true
# Resolve the project and old backend together rather than using the current lock.
deps =
    -e {toxinidir}
    pytest
    h5py<3.15
    pymc==6.0.0
    pytensor==3.0.2
commands =
    pytest {posargs:tests/models/test_shape_hooks.py}

[testenv:docs-strict]
deps =
  sphinx==9.1.0
  pydata-sphinx-theme==0.21.0
  jupyter-sphinx==0.5.3
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --no-toc \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/
  sphinx-build -M html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build} -n -W --keep-going

[testenv:docs-full]
description = "Regenerate the API reference and build all documentation."
deps =
  sphinx==9.1.0
  pydata-sphinx-theme==0.21.0
  jupyter-sphinx==0.5.3
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --no-toc \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/
  sphinx-build -M html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build} --keep-going

[testenv:docs-api]
description = "Regenerate the Sphinx API reference files."
skip_install = true
deps =
  sphinx==9.1.0
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --no-toc \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/

[testenv:docs]
description = "Incrementally build the Sphinx documentation for local preview."
deps =
  sphinx==9.1.0
  pydata-sphinx-theme==0.21.0
  jupyter-sphinx==0.5.3
commands =
  # don't be nitpicky or convert warnings to errors
  sphinx-build -M html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build} --keep-going
