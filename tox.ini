[tox]
min_version = 4.24
requires =
    tox>=4.24
    tox-uv
isolated_build = True
env_list =
    py310-openghgCur
    borrowed-types
    lint

[testenv]
description =
    openghgDev: "Run tests under {base_python} on OpenGHG devel branch."
    openghgCur: "Run tests under {base_python} on current OpenGHG release."
    openghgPrev: "Run tests under {base_python} on previous OpenGHG minor release."
# Use the non-lockfile uv runner so factor-specific OpenGHG deps are honored.
runner = uv-venv-runner
package = uv-editable
deps =
    pytest
    pytest-xdist
    openghgDev: git+https://github.com/openghg/openghg.git@devel
    openghgPrev: {env:OPENGHG_PREV_SPEC:openghg==0.18.0}
commands =
    pytest -n {env:PYTEST_XDIST_WORKERS:2} --dist=worksteal {posargs:tests}

[testenv:lint]
description = "Run linters."
skip_install = true
deps =
    ruff==0.16.0
commands =
    ruff check {posargs:.}

[testenv:type]
description = "Run type checker."
deps =
    mypy
commands =
    mypy {posargs:openghg_inversions}

[testenv:borrowed-types]
description = "Verify experimental borrowed-reference diagnostics with Pyright and Mypy."
deps =
    pytest
    pyright==1.1.408
    mypy==1.19.1
commands =
    pytest {posargs:tests/typing/test_borrowed_typing.py}

[testenv:docs-strict]
#skip_install = True
deps =
  sphinx>=4
  pydata-sphinx-theme
  jupyter-sphinx>=0.5.3
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/
  sphinx-build -n -W --keep-going -b html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build}

[testenv:docs]
#skip_install = True
deps =
  sphinx>=4
  pydata-sphinx-theme
  jupyter-sphinx>=0.5.3
commands =
  sphinx-apidoc \
      --templatedir {env:DOCS_SOURCE_DIR:docs}/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --separate \
      -o {env:DOCS_SOURCE_DIR:docs}/reference/ \
      openghg_inversions/

  # don't be nitpicky or convert warnings to errors
  sphinx-build --keep-going -b html {env:DOCS_SOURCE_DIR:docs}/ {env:DOCS_BUILD_DIR:docs/_build}
