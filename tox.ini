[tox]
min_version = 4.24
requires =
    tox>=4.24
    tox-uv
isolated_build = True
env_list =
    py310-openghgCur
    lint

[testenv]
description =
    openghgDev: "Run tests under {base_python} on OpenGHG devel branch."
    openghgCur: "Run tests under {base_python} on current OpenGHG release."
    openghgPrev: "Run tests under {base_python} on previous OpenGHG minor release."
# Use the non-lockfile uv runner so factor-specific OpenGHG deps are honored.
runner = uv-venv-runner
package = uv-editable
allowlist_externals =
    bash
pass_env =
    PYTENSOR_COMPILER_BOOTSTRAP
    PYTENSOR_COMPILER_MODULE
    PYTENSOR_FLAGS
    PYTENSOR_MODULE_INIT
deps =
    pytest
    pytest-xdist
    openghgDev: git+https://github.com/openghg/openghg.git@devel
    openghgPrev: {env:OPENGHG_PREV_SPEC:openghg==0.18.0}
commands =
    bash {tox_root}/scripts/run_pytest_with_pytensor_compiler.sh pytest -n {env:PYTEST_XDIST_WORKERS:2} --dist=loadscope {posargs:tests}

[testenv:lint]
description = "Run linters."
skip_install = true
deps =
    ruff
commands =
    ruff check {posargs:.}

[testenv:type]
description = "Run type checker."
deps =
    mypy
commands =
    mypy {posargs:openghg_inversions}

[testenv:docs-strict]
#skip_install = True
deps =
  sphinx>=4
  pydata-sphinx-theme
commands =
  sphinx-apidoc \
      --templatedir docs/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --separate \
      -o docs/reference/ \
      openghg_inversions/
  sphinx-build -n -W --keep-going -b html docs/ docs/_build

[testenv:docs]
#skip_install = True
deps =
  sphinx>=4
  pydata-sphinx-theme
commands =
  sphinx-apidoc \
      --templatedir docs/_templates \
      --force \
      --implicit-namespaces \
      --module-first \
      --separate \
      -o docs/reference/ \
      openghg_inversions/

  # don't be nitpicky or convert warnings to errors
  sphinx-build --keep-going -b html docs/ docs/_build
