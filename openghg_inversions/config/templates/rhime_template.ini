; =======================================================================================
; OpenGHG Inversions RHIME configuration file
; =======================================================================================
; New RHIME configs use flux_sources: OpenGHG flux source metadata values.
; Legacy emissions_name is accepted only as a compatibility key when flux_sources is absent.

[INPUT.MEASUREMENTS]
species = ""
sites = []
averaging_period = []
start_date = " "
end_date = " "
inlet = None
instrument = None
calibration_scale = None
obs_data_level = None
filters = []

[INPUT.STORES]
bc_store = "user"
obs_store = "user"
footprint_store = "user"
emissions_store = "user"

[INPUT.PRIORS]
domain = " "
met_model = None
fp_model = None
fp_height = None
fp_species = None
; flux_sources gives the OpenGHG source values used to retrieve flux data.
flux_sources = []
; Optional one-to-one mapping from sector labels to unique OpenGHG source values.
sector_sources = None
bc_input = None

[INPUT.BASIS_CASE]
basis_algorithm = "weighted"
bc_basis_case = "NESW"
fp_basis_case = None
nbasis = 100
basis_directory = None
bc_basis_directory = None
country_file = None
country_directory = None

[RHIME.PDF]
x_prior = {"pdf": "lognormal", "mean": 1.0, "stdev": 1.0}
; In multi-sector RHIME, sector_priors must contain every sector key when supplied.
; Leave this as None to apply the shared x_prior to every sector.
sector_priors = None
bc_prior = {"pdf": "truncatednormal", "mu": 1.0, "sigma": 0.05, "lower": 0.0}
sigma_prior = {"pdf": "uniform", "lower": 0.1, "upper": 3.0}
add_offset = False
offset_prior = {"pdf": "normal", "mu": 0, "sigma": 1}

[RHIME.SPLIT]
bc_freq = None
sigma_freq = None
sigma_per_site = True

[RHIME.ITERATIONS]
draws = 1000
burn = 0
tune = 1000
chains = 4

[RHIME.OPTIONS]
averaging_error = True
min_error = 0.0
fix_basis_outer_regions = False
; Use "compiled" to opt into the experimental semantic-plan compiler.
builder_strategy = "concrete"
; "lazy" records and applies zero-fill lazily; "count" computes exact non-finite flux counts once.
flux_non_finite_check = "lazy"
use_bc = True
nuts_sampler = "pymc"
save_trace = False
save_inversion_output = True
pollution_events_from_obs = False
no_model_error = False
sample_kwargs = {}

[RHIME.OUTPUT]
output_path = " "
output_name = "rhime"
output_format = "inv_out"
