; =======================================================================================
; OpenGHG Inversions RHIME satellite configuration file
; =======================================================================================
; This template uses the same modern parameter names and sections as
; openghg_inversions/config/templates/rhime_template.ini.
;
; Run a single-sector inversion with:
;   openghg-inversions run-rhime -c <config-file>
;
; New RHIME configs use flux_sources: OpenGHG flux source metadata values.
; Legacy emissions_name is not used in this template.

[INPUT.MEASUREMENTS]
species = "ch4"
; Satellite sites must use "satellitename-obs_region", for example
; "GOSAT-BRAZIL". The satellite name and observation region must match the
; footprint metadata. Supply one platform entry per site.
sites = ["GOSAT-BRAZIL"]
averaging_period = ["1H"]
start_date = "2016-01-01"
end_date = "2016-02-01"
inlet = ["column"]
instrument = [None]
platform = ["satellite"]
; Maximum retrieved vertical level. Supply one integer or None per site.
max_level = [3]
; False selects integrated footprints, True selects time-resolved footprints,
; and None leaves the OpenGHG search unconstrained. A list may be aligned to sites.
time_resolved = None
calibration_scale = None
obs_data_level = None
filters = []

[INPUT.STORES]
bc_store = "shared_satellite_store"
obs_store = "shared_satellite_store"
footprint_store = "shared_satellite_store"
emissions_store = "shared_satellite_store"

[INPUT.PRIORS]
domain = "SOUTHAMERICA"
met_model = None
fp_model = None
fp_height = ["column"]
fp_species = "inert"
; A standard run-rhime config must contain exactly one OpenGHG flux source.
flux_sources = ["all"]
; Use run-rhime-multisector with two or more flux sources and a sector mapping.
sector_sources = None
bc_input = "cams"

[INPUT.BASIS_CASE]
basis_algorithm = "quadtree"
bc_basis_case = "NESW"
fp_basis_case = None
nbasis = 50
basis_directory = None
bc_basis_directory = None
; Set country_file to the country-definition NetCDF for the selected domain
; when producing PARIS flux output.
country_file = None
country_directory = None

[RHIME.PDF]
x_prior = {"pdf": "normal", "mu": 1.0, "sigma": 1.0}
sector_priors = None
bc_prior = {"pdf": "normal", "mu": 1.0, "sigma": 1.0}
sigma_prior = {"pdf": "uniform", "lower": 0.1, "upper": 10.0}
add_offset = False
offset_prior = {"pdf": "normal", "mu": 0, "sigma": 1}

[RHIME.SPLIT]
bc_freq = "monthly"
sigma_freq = "5D"
sigma_per_site = True

[RHIME.ITERATIONS]
draws = 1000
burn = 0
tune = 1000
chains = 4

[RHIME.OPTIONS]
averaging_error = False
min_error = "residual"
min_error_options = {"by_site": True}
fix_basis_outer_regions = False
builder_strategy = "concrete"
aggregation_error_mode = "auto"
flux_non_finite_check = "lazy"
use_bc = True
nuts_sampler = "numpyro"
save_trace = True
save_inversion_output = True
pollution_events_from_obs = True
no_model_error = False
sample_kwargs = {}

[RHIME.OUTPUT]
output_path = "outputs"
output_name = "satellite_inversion"
; Column observations cannot use legacy output. PARIS uses the modern
; InversionOutput pathway and retains satellite platform/prior-factor fields.
output_format = "paris"
; The latest PARIS templates support non-European domains. With
; country_selections=None, countries are taken from country_file.
paris_postprocessing_kwargs = {"template_version": "latest", "country_selections": None}
