; Small, complete standard RHIME example. Replace store-local source names
; after checking them with the OpenGHG search functions described in the
; standard tutorial. The sampler settings are a smoke test, not a scientific run.

[INPUT.MEASUREMENTS]
species = "ch4"
sites = ["TAC"]
averaging_period = ["1h"]
start_date = "2019-01-01"
end_date = "2019-01-02"
inlet = ["185m"]
instrument = ["picarro"]
filters = []

[INPUT.STORES]
bc_store = "user"
obs_store = "user"
footprint_store = "user"
emissions_store = "user"

[INPUT.PRIORS]
domain = "EUROPE"
fp_model = "NAME"
fp_height = ["185m"]
flux_sources = ["total-ukghg-edgar7"]
bc_input = "cams"

[INPUT.BASIS_CASE]
basis_algorithm = "quadtree"
bc_basis_case = "NESW"
nbasis = 4
bc_basis_directory = "bc_basis_functions"

[RHIME.PDF]
x_prior = {"pdf": "lognormal", "mean": 1.0, "stdev": 1.0}
bc_prior = {"pdf": "truncatednormal", "mu": 1.0, "sigma": 0.05, "lower": 0.0}
sigma_prior = {"pdf": "uniform", "lower": 0.1, "upper": 3.0}

[RHIME.SPLIT]
sigma_per_site = True

[RHIME.ITERATIONS]
draws = 50
burn = 0
tune = 50
chains = 2

[RHIME.OPTIONS]
use_bc = True
averaging_error = True
min_error = 0.0
builder_strategy = "concrete"
nuts_sampler = "pymc"
save_trace = False
save_inversion_output = True
sample_kwargs = {"random_seed": 108, "compute_convergence_checks": False}

[RHIME.OUTPUT]
output_path = "outputs"
output_name = "standard_tutorial"
output_format = "inv_out"
