; Small, complete multisector RHIME example using the companion tutorial store.
; The sampler settings are a smoke test, not a scientific run.

[INPUT.MEASUREMENTS]
species = "ch4"
sites = ["MHD", "TAC"]
averaging_period = ["4h", "4h"]
start_date = "2020-01-01"
end_date = "2020-01-08"
inlet = ["24m", "185m"]
filters = []

[INPUT.STORES]
bc_store = "inversions_tutorial_data"
obs_store = "inversions_tutorial_data"
footprint_store = "inversions_tutorial_data"
emissions_store = "inversions_tutorial_data"

[INPUT.PRIORS]
domain = "EUROPE"
fp_model = "NAME"
fp_height = ["10m", "185m"]
fp_species = "inert"
met_model = "UKV"
flux_sources = ["edgar-v80-anthropogenic", "wetcharts-v131-wetlands"]
sector_sources = {"anthropogenic": "edgar-v80-anthropogenic", "wetlands": "wetcharts-v131-wetlands"}
bc_input = "camsv22r2_daily"

[INPUT.BASIS_CASE]
basis_algorithm = "quadtree"
bc_basis_case = "NESW"
nbasis = 4

[RHIME.PDF]
x_prior = {"pdf": "lognormal", "mean": 1.0, "stdev": 1.0}
sector_priors = {"anthropogenic": {"pdf": "lognormal", "mean": 1.0, "stdev": 1.0}, "wetlands": {"pdf": "lognormal", "mean": 1.0, "stdev": 1.0}}
bc_prior = {"pdf": "truncatednormal", "mu": 1.0, "sigma": 0.05, "lower": 0.0}
sigma_prior = {"pdf": "uniform", "lower": 0.1, "upper": 3.0}

[RHIME.SPLIT]
sigma_per_site = True

[RHIME.ITERATIONS]
draws = 50
burn = 0
tune = 50
chains = 2

[RHIME.OPTIONS]
use_bc = True
averaging_error = True
min_error = 0.0
nuts_sampler = "pymc"
save_trace = False
save_inversion_output = True
sample_kwargs = {"random_seed": 108, "compute_convergence_checks": False, "progressbar": False}

[RHIME.OUTPUT]
output_path = "outputs"
output_name = "multisector_tutorial"
output_format = "inv_out"
