# CO2-only coherent-reduction recipe.
#
# Data preparation supplies H_alpha, alpha_prior_covariance,
# fixed_prior_contribution and aggregation_error_covariance.

[co2]
species = co2
aggregation_error_mode = dense

[co2.model_data_mismatch]
# Fixed-only Verification Games policy. The public runner does not yet parse
# this INI, so callers pass fixed_model_mismatch=1.0 and no_model_error=True.
infer = false
fixed_standard_deviation = 1.0
# Retained for an explicitly enabled inferred-mismatch alternative.
sigma_per_site = true
sigma_frequency = monthly
sigma_prior_pdf = halfnormal
sigma_prior_sigma = 1.0

[sampling]
draws = 1000
tune = 1000
chains = 4
# Accepted UOB Verification Games control; callers still pass this policy
# explicitly until the CO2 INI has a public resolver.
nuts_sampler = numpyro
target_accept = 0.95
