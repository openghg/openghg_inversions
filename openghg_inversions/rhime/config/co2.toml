# Ordinary CO2 replay from a coherent prepared-input artifact.
# Replace this path with an artifact written by Co2PreparedInputs.save().
format_version = 1
recipe = "co2"
variant = "ordinary"

[prepared_inputs]
path = "prepared-co2.zarr"
# Keep the original requested window, even when filtering removed edge observations.
start_date = "2020-01-01"
end_date = "2020-02-01"
domain = "EUROPE"

[likelihood]
kind = "additive_sigma"
sigma_prior = { pdf = "halfnormal", sigma = 1.0 }

[sampling]
draws = 1000
tune = 1000
chains = 4
nuts_sampler = "numpyro"
target_accept = 0.95
random_seed = 12345
