# Ordinary CO2 replay from a coherent prepared-input artifact.
# Replace this path with an artifact written by Co2PreparedInputs.save().
format_version = 1
recipe = "co2"
variant = "ordinary"

[prepared_inputs]
path = "prepared-co2.zarr"

[likelihood]
kind = "additive_sigma"
sigma_prior = { pdf = "halfnormal", sigma = 1.0 }

[sampling]
draws = 1000
tune = 1000
chains = 4
nuts_sampler = "numpyro"
target_accept = 0.95
random_seed = 12345

# Optional centred additive boundary corrections (observation concentration units).
# Requires prepared G_bc and explicit bc_centering_weights; replaces BC scaling.
# [model.boundary]
# enabled = true
# anomaly_scale = 0.5
# mean_shift_prior = { pdf = "normal", mu = 0.0, sigma = 0.5 }
