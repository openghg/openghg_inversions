# Ordinary CO2 inference from a coherent prepared-input artifact.
# Replace this path with an artifact written by Co2PreparedInputs.save().
format_version = 1
recipe = "co2"

[prepared_inputs]
path = "prepared-co2.zarr"
# Keep the original requested window, even when filtering removed edge observations.
start_date = "2020-01-01"
end_date = "2020-02-01"
domain = "EUROPE"

# To build a new preparation instead, replace `path` above with these tables
# (CO2 only). Acquisition keeps centered boundary operands; the [model.boundary]
# type selects the prepared representation unless it is set explicitly.
# boundary_representation = "centered"   # optional: "ordinary" or "centered"
# aggregation_error_rank = 512           # or "exact"
#
# [prepared_inputs.acquisition]
# sites = ["MHD"]
# averaging_period = "1h"
# time_resolved = true                  # required by time_resolved surface transport
# flux_sources = ["biosphere", "fossil"]
# surface_transport = { biosphere = "time_resolved", fossil = "integrated" }
# boundary_reference = 400.0
# boundary_reference_units = "ppm"
# boundary_mass_tolerance = 1e-4
#
# [prepared_inputs.observations]
# filters = ["daytime9to5"]
#
# [prepared_inputs.basis]
# algorithm = "weighted"
# nbasis = 100
# bc_algorithm = "NESW"
#
# [prepared_inputs.native_prior]
# sigma = 0.5
# correlation_length = 1.5

# Per-source native priors replace the single shared field: with a `sources`
# table each flux source has its own scaling field, amplitude and kernel, GPP
# and TER may be correlated under one shared kernel, and all sources are reduced
# jointly to a (source, region) retained state. Name exactly the acquisition
# flux_sources. A partition with a `source` dimension gives each source its own
# regions; a shared partition or generated basis is repeated per source. With
# restriction = "absolute_flux_weighted_mean" every retained region needs nonzero
# prior flux of its source, so a repeated partition usually needs
# retained_regions_path to leave out e.g. biosphere sea regions and ocean land.

# Per-source native priors (E-r07): A1 gross anchor, rho = 0.7, biosphere 3 x 6 deg, FF 1 x 2.5 deg.
# [prepared_inputs.native_prior]
# restriction = "absolute_flux_weighted_mean"  # or "bucket" (default)
# class_labels_path = "native-classes.nc"      # integer class_labels on (source, lat, lon)
# retained_regions_path = "retained.json"      # optional {source = [partition labels]}; others go into A
# gpp_ter_correlation = 0.7                    # Corr of the GPP and TER scaling anomalies
# gpp_source = "co2_BASE_GPP"
# ter_source = "co2_BASE_TER"
#
# # Sources without sigma get one amplitude matching country-total SD targets.
# [prepared_inputs.native_prior.calibration]
# targets_path = "country-sd-targets.nc"       # functional_weights and target_sd
# statistic = "geometric-mean"
#
# [prepared_inputs.native_prior.sources.co2_BASE_GPP]
# latitude_correlation_length = 3.0
# longitude_correlation_length = 6.0
#
# [prepared_inputs.native_prior.sources.co2_BASE_TER]
# latitude_correlation_length = 3.0
# longitude_correlation_length = 6.0
#
# [prepared_inputs.native_prior.sources.co2_BASE_FF]
# latitude_correlation_length = 1.0
# longitude_correlation_length = 2.5
#
# [prepared_inputs.native_prior.sources.co2_BASE_ocean]
# sigma = 2.6
# correlation_length = 3.0

# Per-source native priors (geodesic): great-circle kernels of 500 km (biosphere) and 200 km (FF), rho = 0.7.
# [prepared_inputs.native_prior]
# class_labels_path = "native-classes.nc"
# gpp_ter_correlation = 0.7
# gpp_source = "co2_BASE_GPP"
# ter_source = "co2_BASE_TER"
#
# # A geodesic class is a dense block of 8 n**2 bytes for n cells, so name only
# # classes up to about 1e4 cells (here class 1); other classes stay separable.
# [prepared_inputs.native_prior.sources.co2_BASE_GPP]
# sigma = 0.6
# correlation_length = 3.0
# geodesic_correlation_length_km = { 1 = 500.0 }
#
# [prepared_inputs.native_prior.sources.co2_BASE_TER]
# sigma = 0.7
# correlation_length = 3.0
# geodesic_correlation_length_km = { 1 = 500.0 }
#
# [prepared_inputs.native_prior.sources.co2_BASE_FF]
# sigma = 0.8
# correlation_length = 3.0
# geodesic_correlation_length_km = { 1 = 200.0 }
#
# [prepared_inputs.native_prior.sources.co2_BASE_ocean]
# sigma = 2.6
# correlation_length = 3.0

[likelihood]
kind = "additive_sigma"
sigma_prior = { pdf = "halfnormal", sigma = 1.0 }

[sampling]
draws = 1000
tune = 1000
chains = 4
target_accept = 0.95
random_seed = 12345

# Optional centred additive boundary corrections (observation concentration units).
# Requires centered operands and bc_centering_weights; replaces BC scaling. A built
# preparation produces centered operands for this type and reads the weights from
# prepared_inputs.bc_centering_weights_path. Python callers preparing from canonical
# inputs pass bc_centering_weights to prepare_co2_inputs, handoffs.prepare or run_co2.
# [model.boundary]
# type = "additive"
# anomaly_scale = 0.5
# mean_shift_prior = { pdf = "normal", mu = 0.0, sigma = 0.5 }

# Other centred correction structures (see docs/usage/boundary_correction_structures.rst):
#   anomalies = "period_contrasts" or "independent" (mean_shift_prior then optional),
#   mean_by_period = true (requires frequency), or type = "anomaly_scaling" with
#   scale_sd = 0.8 and reference = "whole_window_transport_mean".

# A calibrated biosphere prior saved with BiospherePriorConfig
# (see examples/biosphere_prior/saved_configuration.py).
# [model.biosphere]
# path = "biosphere-prior.nc"
