# Ordinary CO2 inference from a coherent prepared-input artifact.
# Replace this path with an artifact written by Co2PreparedInputs.save().
format_version = 1
recipe = "co2"

[prepared_inputs]
path = "prepared-co2.zarr"
# Keep the original requested window, even when filtering removed edge observations.
start_date = "2020-01-01"
end_date = "2020-02-01"
domain = "EUROPE"

[likelihood]
kind = "additive_sigma"
sigma_prior = { pdf = "halfnormal", sigma = 1.0 }

[sampling]
draws = 1000
tune = 1000
chains = 4
target_accept = 0.95
random_seed = 12345

# Optional centred additive boundary corrections (observation concentration units).
# Requires native centered operands and bc_centering_weights stored at preparation:
# pass bc_centering_weights to prepare_co2_inputs, handoffs.prepare or run_co2.
# Replaces BC scaling.
# [model.boundary]
# type = "additive"
# anomaly_scale = 0.5
# mean_shift_prior = { pdf = "normal", mu = 0.0, sigma = 0.5 }
