# CO2 replay with inferred site amplitudes and a fixed OU timescale.
# Replace this path with an artifact written by Co2PreparedInputs.save().
format_version = 1
recipe = "co2"

[data]
path = "prepared-co2.zarr"
# Preserve the original requested window after filtering.
start_date = "2020-01-01"
end_date = "2020-02-01"
domain = "EUROPE"

# To build a new preparation instead, replace `path` above with these tables
# (CO2 only). Acquisition keeps centered boundary operands; the [model.boundary]
# type selects the prepared representation unless it is set explicitly.
# flux_sources = ["biosphere", "fossil"]
#
# [data.acquisition]
# sites = ["MHD"]
# averaging_period = "1h"
# time_resolved = true                  # required by time_resolved surface transport
# surface_transport = { biosphere = "time_resolved", fossil = "integrated" }
# boundary_reference = 400.0
# boundary_reference_units = "ppm"
# boundary_mass_tolerance = 1e-4
#
# [data.preparation]
# boundary_representation = "centered"   # optional: "ordinary" or "centered"
# aggregation_error_rank = 512           # or "exact"
# filters = ["daytime9to5"]
#
# [data.preparation.basis]
# algorithm = "weighted"
# nbasis = 100
# bc_algorithm = "NESW"
#
# [data.preparation.native_prior]
# stdev = 0.5
# correlation_length = 1.5
#
# [model.boundary]
# type = "multiplicative"

[likelihood]
kind = "fixed_ou"
tau_hours = 24.0
site_amplitude_prior = {pdf = "halfnormal", sigma = 1.0}

[sampling]
sigma_target_accept = 0.8
state_target_accept = 0.9
draws = 1000
tune = 1000
chains = 4
random_seed = 12345

[outputs]
output_format = "basic"
output_path = "outputs"
output_name = "co2-fixed-ou"

# Other centred correction structures (see docs/usage/boundary_correction_structures.rst):
#   anomalies = "period_contrasts" or "independent" (mean_shift_prior then optional),
#   mean_by_period = true (requires frequency), or type = "anomaly_scaling" with
#   scale_sd = 0.8 and reference = "whole_window_transport_mean".

# Hold outer-region flux states at their prior mean with zero uncertainty, a
# what-if for a known outer prior (see docs/usage/atmospheric_baseline.rst).
# Needs basis_group labels on the prepared retained states, which come from the
# coherent reduction's restriction; configured CO2 preparation does not add
# them yet (issue #1094). fixed_sources holds only outer states with those
# source labels.
# [model.outer_flux]
# mode = "fixed"
# outer_groups = ["outer"]
