# Linked CO2/O2 execution from a public prepared-input artifact.
# The current configuration requires one shared concentration-unit label.
format_version = 1
recipe = "co2_o2"

[prepared_inputs]
path = "co2-o2-prepared.nc"
start_date = "2020-01-01"
end_date = "2020-02-01"
domain = "EUROPE"

[channels.co2]
units = "ppm"
independent_error_sd = 1.0

[channels.o2]
units = "ppm"
independent_error_sd = 1.0

[likelihood]
kind = "fixed_independent"
# Fixed-amplitude OU alternative (requires sampling.nuts_sampler = "pymc"):
# kind = "fixed_ou"
# tau_hours = 24.0
# fixed_site_amplitudes = 0.5

[sampling]
draws = 1000
tune = 1000
chains = 4
nuts_sampler = "numpyro"
target_accept = 0.95
random_seed = 12345

[outputs]
output_format = "basic"

# Optional channel-specific baseline settings (require matching prepared H_bc).
# [channels.co2.boundary]
# enabled = true
# prior = {pdf = "normal", mu = 1.0, sigma = 0.1}
#
# [channels.o2.offset]
# per_site = false
# prior = {pdf = "normal", mu = 0.0, sigma = 1.0}

# Additive O2 alternative, requiring explicit prepared unit responses and weights.
# Scales are illustrative ppm values, not recommended defaults.
# [channels.o2.boundary]
# enabled = true
# anomaly_scale = 1.0
# mean_shift_prior = {pdf = "normal", mu = 0.0, sigma = 2.0}
