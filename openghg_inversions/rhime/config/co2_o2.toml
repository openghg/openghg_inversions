# Linked CO2/O2 replay from an in-memory prepared-input artifact.
# The current configuration requires one shared concentration-unit label.
format_version = 1
recipe = "co2_o2"
variant = "linked"

[channels.co2]
units = "ppm"
independent_error_sd = 1.0

[channels.o2]
units = "ppm"
independent_error_sd = 1.0

[sampling]
draws = 1000
tune = 1000
chains = 4
nuts_sampler = "numpyro"
target_accept = 0.95
random_seed = 12345

# Optional channel-specific baseline settings (require matching prepared H_bc).
# [channels.co2.boundary]
# enabled = true
# prior = {pdf = "normal", mu = 1.0, sigma = 0.1}
#
# [channels.o2.offset]
# per_site = false
# prior = {pdf = "normal", mu = 0.0, sigma = 1.0}
